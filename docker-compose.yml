# Shared settings. Healthchecks use wget, which ships with the alpine images.
x-service: &service
  restart: unless-stopped

# Hardening shared by every container built from this repo (RabbitMQ keeps its own image defaults):
# the images already run as the unprivileged "node" user; these drop what a Node process never needs.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-storage: &storage
  <<: [*service, *hardened]
  build:
    context: .
    dockerfile: services/storage-node/Dockerfile
  depends_on:
    coordinator:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
    interval: 3s
    timeout: 2s
    retries: 10

services:
  rabbitmq:
    <<: *service
    image: rabbitmq:3.13-management
    ports:
      # Bound to localhost only: the broker is not for the outside network.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq   # queued jobs survive a broker restart
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  coordinator:
    <<: [*service, *hardened]
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    environment:
      PORT: "3006"
      HEARTBEAT_TIMEOUT_MS: "6000"
      STORAGE_NODES: '[{"id":"s0-a","shard":0,"url":"http://storage-s0-a:4000"},{"id":"s0-b","shard":0,"url":"http://storage-s0-b:4000"},{"id":"s0-c","shard":0,"url":"http://storage-s0-c:4000"},{"id":"s1-a","shard":1,"url":"http://storage-s1-a:4000"},{"id":"s1-b","shard":1,"url":"http://storage-s1-b:4000"},{"id":"s1-c","shard":1,"url":"http://storage-s1-c:4000"},{"id":"s2-a","shard":2,"url":"http://storage-s2-a:4000"},{"id":"s2-b","shard":2,"url":"http://storage-s2-b:4000"},{"id":"s2-c","shard":2,"url":"http://storage-s2-c:4000"}]'
    ports:
      # Localhost only: /internal/* is for the services, never for the public network.
      - "127.0.0.1:3006:3006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  storage-s0-a:
    <<: *storage
    environment:
      NODE_ID: s0-a
      SHARD: "0"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s0-a:/data
    ports:
      # Localhost only, for debugging: host port 4001 is node s0-a's port 4000.
      - "127.0.0.1:4001:4000"

  storage-s0-b:
    <<: *storage
    environment:
      NODE_ID: s0-b
      SHARD: "0"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s0-b:/data
    ports:
      # Localhost only, for debugging: host port 4002 is node s0-b's port 4000.
      - "127.0.0.1:4002:4000"

  storage-s0-c:
    <<: *storage
    environment:
      NODE_ID: s0-c
      SHARD: "0"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s0-c:/data
    ports:
      # Localhost only, for debugging: host port 4003 is node s0-c's port 4000.
      - "127.0.0.1:4003:4000"

  storage-s1-a:
    <<: *storage
    environment:
      NODE_ID: s1-a
      SHARD: "1"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s1-a:/data
    ports:
      # Localhost only, for debugging: host port 4004 is node s1-a's port 4000.
      - "127.0.0.1:4004:4000"

  storage-s1-b:
    <<: *storage
    environment:
      NODE_ID: s1-b
      SHARD: "1"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s1-b:/data
    ports:
      # Localhost only, for debugging: host port 4005 is node s1-b's port 4000.
      - "127.0.0.1:4005:4000"

  storage-s1-c:
    <<: *storage
    environment:
      NODE_ID: s1-c
      SHARD: "1"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s1-c:/data
    ports:
      # Localhost only, for debugging: host port 4006 is node s1-c's port 4000.
      - "127.0.0.1:4006:4000"

  storage-s2-a:
    <<: *storage
    environment:
      NODE_ID: s2-a
      SHARD: "2"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s2-a:/data
    ports:
      # Localhost only, for debugging: host port 4007 is node s2-a's port 4000.
      - "127.0.0.1:4007:4000"

  storage-s2-b:
    <<: *storage
    environment:
      NODE_ID: s2-b
      SHARD: "2"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s2-b:/data
    ports:
      # Localhost only, for debugging: host port 4008 is node s2-b's port 4000.
      - "127.0.0.1:4008:4000"

  storage-s2-c:
    <<: *storage
    environment:
      NODE_ID: s2-c
      SHARD: "2"
      PORT: "4000"
      COORDINATOR_URL: "http://coordinator:3006"
      DATA_DIR: /data
      MONGODB_URI: "${MONGODB_URI:-}"
      MONGODB_DB: "${MONGODB_DB:-emergency}"
    volumes:
      - data-s2-c:/data
    ports:
      # Localhost only, for debugging: host port 4009 is node s2-c's port 4000.
      - "127.0.0.1:4009:4000"

  request-service:
    <<: [*service, *hardened]
    build:
      context: .
      dockerfile: services/request-service/Dockerfile
    environment:
      PORT: "3005"
      COORDINATOR_URL: "http://coordinator:3006"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
    ports:
      - "3005:3005"
    depends_on:
      coordinator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  matching-service:
    <<: [*service, *hardened]
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    environment:
      PORT: "3007"
      COORDINATOR_URL: "http://coordinator:3006"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      # Coordinates match within this distance; zone names match exactly.
      MATCH_RADIUS_KM: "${MATCH_RADIUS_KM:-5}"
    ports:
      # Localhost only, for debugging (health check).
      - "127.0.0.1:3007:3007"
    depends_on:
      coordinator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  web:
    <<: [*service, *hardened]
    build:
      context: web
    environment:
      API_URL: "http://request-service:3005"
    ports:
      # Set WEB_PORT if 3000 is already taken on your machine.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      request-service:
        condition: service_healthy
    healthcheck:
      # The page is server-rendered, so a 200 means the Start server is really up.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  rabbitmq-data:
  data-s0-a:
  data-s0-b:
  data-s0-c:
  data-s1-a:
  data-s1-b:
  data-s1-c:
  data-s2-a:
  data-s2-b:
  data-s2-c:
