apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: emergency
spec:
  # One replica: the node registry (heartbeats) lives in this process's memory.
  replicas: 1
  selector:
    matchLabels: {app: coordinator}
  template:
    metadata:
      labels: {app: coordinator}
    spec:
      containers:
        - name: coordinator
          image: emergency/coordinator:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3006"}
            - {name: HEARTBEAT_TIMEOUT_MS, value: "6000"}
            - name: STORAGE_NODES
              value: '[{"id":"storage-s0-0","shard":0,"url":"http://storage-s0-0.storage-s0:4000"},{"id":"storage-s0-1","shard":0,"url":"http://storage-s0-1.storage-s0:4000"},{"id":"storage-s1-0","shard":1,"url":"http://storage-s1-0.storage-s1:4000"},{"id":"storage-s1-1","shard":1,"url":"http://storage-s1-1.storage-s1:4000"},{"id":"storage-s2-0","shard":2,"url":"http://storage-s2-0.storage-s2:4000"},{"id":"storage-s2-1","shard":2,"url":"http://storage-s2-1.storage-s2:4000"}]'
          ports:
            - {containerPort: 3006}
          readinessProbe:
            httpGet: {path: /health, port: 3006}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: emergency
spec:
  type: NodePort
  selector: {app: coordinator}
  ports:
    - {port: 3006, targetPort: 3006, nodePort: 30006}
