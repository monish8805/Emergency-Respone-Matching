apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: emergency
spec:
  # One replica on purpose: it serializes writes per key and tracks node health in memory.
  replicas: 1
  strategy:
    type: Recreate   # never run two coordinators side by side during a rollout
  selector:
    matchLabels: {app: coordinator}
  template:
    metadata:
      labels: {app: coordinator}
    spec:
      containers:
        - name: coordinator
          image: emergency/coordinator:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3006"}
          envFrom:
            - configMapRef: {name: app-config}
          ports:
            - {containerPort: 3006}
          readinessProbe:
            httpGet: {path: /health, port: 3006}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 3006}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
# ClusterIP only: /internal/* is reachable from inside the cluster, never from outside.
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: emergency
spec:
  selector: {app: coordinator}
  ports:
    - {port: 3006, targetPort: 3006}
