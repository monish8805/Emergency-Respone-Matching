# Non-secret settings shared by the services.
# The RabbitMQ credentials are not stored here: scripts/deploy-k8s.sh creates the
# 'rabbitmq-credentials' Secret with a random password the first time it runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: emergency
data:
  COORDINATOR_URL: "http://coordinator:3006"
  HEARTBEAT_TIMEOUT_MS: "6000"
  # Coordinates match within this distance; zone names match exactly.
  MATCH_RADIUS_KM: "5"
  SWEEP_MS: "15000"
  SWEEP_MIN_AGE_MS: "10000"
  # The shard layout: 3 shards, each with two pods (the first is the primary).
  STORAGE_NODES: '[{"id":"storage-s0-0","shard":0,"url":"http://storage-s0-0.storage-s0:4000"},{"id":"storage-s0-1","shard":0,"url":"http://storage-s0-1.storage-s0:4000"},{"id":"storage-s1-0","shard":1,"url":"http://storage-s1-0.storage-s1:4000"},{"id":"storage-s1-1","shard":1,"url":"http://storage-s1-1.storage-s1:4000"},{"id":"storage-s2-0","shard":2,"url":"http://storage-s2-0.storage-s2:4000"},{"id":"storage-s2-1","shard":2,"url":"http://storage-s2-1.storage-s2:4000"}]'
