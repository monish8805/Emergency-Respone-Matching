apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: emergency
spec:
  replicas: 2
  selector:
    matchLabels: {app: request-service}
  template:
    metadata:
      labels: {app: request-service}
    spec:
      containers:
        - name: request-service
          image: emergency/request-service:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3005"}
            - name: COORDINATOR_URL
              valueFrom: {configMapKeyRef: {name: app-config, key: COORDINATOR_URL}}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_URL}}
          ports:
            - {containerPort: 3005}
          readinessProbe:
            httpGet: {path: /health, port: 3005}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 3005}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: emergency
spec:
  type: NodePort
  selector: {app: request-service}
  ports:
    - {port: 3005, targetPort: 3005, nodePort: 30005}
