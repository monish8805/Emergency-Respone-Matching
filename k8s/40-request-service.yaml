apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: emergency
spec:
  replicas: 2
  selector:
    matchLabels: {app: request-service}
  template:
    metadata:
      labels: {app: request-service}
    spec:
      containers:
        - name: request-service
          image: emergency/request-service:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3005"}
            - {name: COORDINATOR_URL, value: "http://coordinator:3006"}
            - {name: RABBITMQ_URL, value: "amqp://rabbitmq:5672"}
          ports:
            - {containerPort: 3005}
          readinessProbe:
            httpGet: {path: /health, port: 3005}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: emergency
spec:
  type: NodePort
  selector: {app: request-service}
  ports:
    - {port: 3005, targetPort: 3005, nodePort: 30005}
