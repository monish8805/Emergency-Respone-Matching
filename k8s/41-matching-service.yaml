apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: emergency
spec:
  replicas: 1
  selector:
    matchLabels: {app: matching-service}
  template:
    metadata:
      labels: {app: matching-service}
    spec:
      containers:
        - name: matching-service
          image: emergency/matching-service:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3007"}
            - {name: COORDINATOR_URL, value: "http://coordinator:3006"}
            - {name: RABBITMQ_URL, value: "amqp://rabbitmq:5672"}
          ports:
            - {containerPort: 3007}
          readinessProbe:
            httpGet: {path: /health, port: 3007}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: emergency
spec:
  selector: {app: matching-service}
  ports:
    - {port: 3007, targetPort: 3007}
