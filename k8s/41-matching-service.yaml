apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: emergency
spec:
  replicas: 1
  selector:
    matchLabels: {app: matching-service}
  template:
    metadata:
      labels: {app: matching-service}
    spec:
      containers:
        - name: matching-service
          image: emergency/matching-service:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3007"}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: rabbitmq-credentials, key: RABBITMQ_URL}}
          envFrom:
            - configMapRef: {name: app-config}
          ports:
            - {containerPort: 3007}
          readinessProbe:
            httpGet: {path: /health, port: 3007}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 3007}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: emergency
spec:
  selector: {app: matching-service}
  ports:
    - {port: 3007, targetPort: 3007}
