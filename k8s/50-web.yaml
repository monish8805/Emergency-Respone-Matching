apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: emergency
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: emergency/web:latest
          imagePullPolicy: Never
          env:
            - {name: PORT, value: "3000"}
            - {name: API_URL, value: "http://request-service:3005"}
          ports:
            - {containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: emergency
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {port: 3000, targetPort: 3000, nodePort: 30000}
