apiVersion: v1
kind: Service
metadata:
  name: storage-s0
  namespace: emergency
spec:
  clusterIP: None
  # Publish DNS for pods before they are ready so the coordinator can always reach them.
  publishNotReadyAddresses: true
  selector: {app: storage, shard: "0"}
  ports:
    - {port: 4000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-s0
  namespace: emergency
spec:
  serviceName: storage-s0
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: storage, shard: "0"}
  template:
    metadata:
      labels: {app: storage, shard: "0"}
    spec:
      # Prefer putting the two nodes of a shard on different machines, so one machine failing
      # cannot take out both copies. "Preferred" so a single-node cluster (minikube) still schedules.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: storage, shard: "0"}
      containers:
        - name: storage
          image: emergency/storage-node:latest
          imagePullPolicy: Never
          env:
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: SHARD, value: "0"}
            - {name: PORT, value: "4000"}
            - {name: DATA_DIR, value: /data}
            - name: COORDINATOR_URL
              valueFrom: {configMapKeyRef: {name: app-config, key: COORDINATOR_URL}}
          ports:
            - {containerPort: 4000}
          readinessProbe:
            httpGet: {path: /health, port: 4000}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 4000}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 256Mi}
---
