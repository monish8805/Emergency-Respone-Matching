apiVersion: v1
kind: Service
metadata:
  name: storage-s0
  namespace: emergency
spec:
  clusterIP: None
  # Publish DNS for pods before they are ready so the coordinator can always reach them.
  publishNotReadyAddresses: true
  selector: {app: storage, shard: "0"}
  ports:
    - {port: 4000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-s0
  namespace: emergency
spec:
  serviceName: storage-s0
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: storage, shard: "0"}
  template:
    metadata:
      labels: {app: storage, shard: "0"}
    spec:
      containers:
        - name: storage
          image: emergency/storage-node:latest
          imagePullPolicy: Never
          env:
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: SHARD, value: "0"}
            - {name: PORT, value: "4000"}
            - {name: COORDINATOR_URL, value: "http://coordinator:3006"}
          ports:
            - {containerPort: 4000}
          readinessProbe:
            httpGet: {path: /health, port: 4000}
            periodSeconds: 3
---
