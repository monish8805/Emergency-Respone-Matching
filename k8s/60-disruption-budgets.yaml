apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-s0
  namespace: emergency
spec:
  # During a node drain or upgrade, never take both nodes of a shard down at once.
  maxUnavailable: 1
  selector:
    matchLabels: {app: storage, shard: "0"}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-s1
  namespace: emergency
spec:
  # During a node drain or upgrade, never take both nodes of a shard down at once.
  maxUnavailable: 1
  selector:
    matchLabels: {app: storage, shard: "1"}
---
apiVersion: policy/v1
