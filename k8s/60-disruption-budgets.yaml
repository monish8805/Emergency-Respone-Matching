apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-s0
  namespace: emergency
spec:
  # During a node drain or upgrade, never take more than one node of a shard down: two of three is a quorum.
  maxUnavailable: 1
  selector:
    matchLabels: {app: storage, shard: "0"}
---
