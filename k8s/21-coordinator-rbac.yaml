# The coordinators elect a leader through a Lease object. This gives them (and only them) the right
# to read and write that one kind of object in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: emergency
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-leader-election
  namespace: emergency
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["coordinator"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-leader-election
  namespace: emergency
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: emergency
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-leader-election
